name: Performance Benchmarks

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'rust/crates/**'
      - 'rust/benches/**'
      - 'rust/Cargo.toml'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'rust/crates/**'
      - 'rust/benches/**'
      - 'rust/Cargo.toml'
  workflow_dispatch:
    inputs:
      full_bench:
        description: 'Run full benchmarks with detailed output'
        required: false
        default: 'false'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Check if benchmarks exist and can compile
  benchmark-check:
    name: Benchmark Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: rust/target
          key: ${{ runner.os }}-cargo-bench-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-check-

      - name: Check benchmarks compilation
        run: cargo bench --manifest-path rust/Cargo.toml --no-run --verbose

  # Run benchmarks on current branch
  run-benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    needs: [benchmark-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: rust/target
          key: ${{ runner.os }}-cargo-bench-run-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-run-

      - name: Run benchmarks
        run: |
          cargo bench --manifest-path rust/Cargo.toml -- --output-format bencher | tee /tmp/current-benchmark.txt

      - name: Archive benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: /tmp/current-benchmark.txt
          retention-days: 90

  # Compare benchmarks for PRs
  benchmark-compare:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [benchmark-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: rust/target
          key: ${{ runner.os }}-cargo-bench-compare-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-compare-

      - name: Run benchmarks on base branch
        run: |
          git stash
          git checkout origin/${{ github.base_ref }}
          echo "Running benchmarks on base branch (${{ github.base_ref }})..."
          cargo bench --manifest-path rust/Cargo.toml -- --output-format bencher > /tmp/base-benchmark.txt 2>&1 || true
          git checkout -
          git stash pop || true

      - name: Run benchmarks on PR branch
        run: |
          echo "Running benchmarks on PR branch..."
          cargo bench --manifest-path rust/Cargo.toml -- --output-format bencher > /tmp/pr-benchmark.txt 2>&1 || true

      - name: Compare benchmark results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Parse bencher format: "test name ... bench: X ns/iter (+/- Y)"
            function parseBenchmarks(content) {
              const results = {};
              const lines = content.split('\n');
              for (const line of lines) {
                const match = line.match(/test\s+(\S+)\s+.*bench:\s+([\d,]+)\s+ns\/iter/);
                if (match) {
                  const name = match[1];
                  const time = parseInt(match[2].replace(/,/g, ''));
                  results[name] = time;
                }
              }
              return results;
            }

            let baseBench = '';
            let prBench = '';

            if (fs.existsSync('/tmp/base-benchmark.txt')) {
              baseBench = fs.readFileSync('/tmp/base-benchmark.txt', 'utf8');
            }

            if (fs.existsSync('/tmp/pr-benchmark.txt')) {
              prBench = fs.readFileSync('/tmp/pr-benchmark.txt', 'utf8');
            }

            const baseResults = parseBenchmarks(baseBench);
            const prResults = parseBenchmarks(prBench);

            let comment = '## 📊 Benchmark Comparison\n\n';
            let hasRegression = false;
            let regressionDetails = [];

            if (Object.keys(baseResults).length > 0 && Object.keys(prResults).length > 0) {
              comment += '| Benchmark | Base | PR | Change |\n';
              comment += '|-----------|------|----|---------|\n';

              for (const [name, prTime] of Object.entries(prResults)) {
                if (baseResults[name]) {
                  const baseTime = baseResults[name];
                  const diff = ((prTime - baseTime) / baseTime * 100).toFixed(1);
                  const arrow = prTime > baseTime ? '🔺' : (prTime < baseTime ? '🔽' : '➡️');

                  // Detect regression (>10% slower)
                  if (parseFloat(diff) > 10) {
                    hasRegression = true;
                    regressionDetails.push(`${name}: +${diff}%`);
                  }

                  const shortName = name.split('::').pop();
                  comment += `| ${shortName} | ${(baseTime/1000).toFixed(1)}µs | ${(prTime/1000).toFixed(1)}µs | ${arrow} ${diff}% |\n`;
                }
              }

              if (hasRegression) {
                comment += '\n### ⚠️ Performance Regression Detected!\n\n';
                comment += 'The following benchmarks are >10% slower:\n';
                for (const detail of regressionDetails) {
                  comment += `- ${detail}\n`;
                }
                comment += '\nPlease investigate before merging.\n';
              } else {
                comment += '\n✅ No significant performance regressions detected.\n';
              }
            } else if (prBench) {
              comment += '### PR Branch Benchmarks\n```\n';
              comment += prBench.substring(0, 2000);
              comment += prBench.length > 2000 ? '\n... (truncated)\n```' : '\n```';
            } else {
              comment += '⚠️ No benchmark results to compare.\n';
            }

            comment += '\n\n<details><summary>Full benchmark output</summary>\n\n```\n';
            comment += prBench.substring(0, 5000);
            comment += '\n```\n</details>\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-comparison-${{ github.run_id }}
          path: |
            /tmp/base-benchmark.txt
            /tmp/pr-benchmark.txt
          retention-days: 90

  # Extended benchmarks (optional, for scheduled runs or manual trigger)
  extended-benchmarks:
    name: Extended Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.full_bench == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: rust/target
          key: ${{ runner.os }}-cargo-bench-extended-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-extended-

      - name: Run extended benchmarks
        run: |
          cargo bench --manifest-path rust/Cargo.toml --verbose -- --output-format bencher | tee /tmp/extended-benchmark.txt

      - name: Archive extended results
        uses: actions/upload-artifact@v4
        with:
          name: extended-benchmarks-${{ github.run_id }}
          path: /tmp/extended-benchmark.txt
          retention-days: 90
