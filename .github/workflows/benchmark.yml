name: Performance Benchmarks

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'rust/crates/**'
      - 'rust/benches/**'
      - 'rust/Cargo.toml'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'rust/crates/**'
      - 'rust/benches/**'
      - 'rust/Cargo.toml'
  # Weekly scheduled benchmarks for historical tracking
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC
  workflow_dispatch:
    inputs:
      full_bench:
        description: 'Run full benchmarks with detailed output'
        required: false
        default: 'false'
      create_issue_on_regression:
        description: 'Create GitHub issue on critical regression'
        required: false
        default: 'true'
      full_dict:
        description: 'Run full-dict benchmarks (816K entries, ~50MB download)'
        required: false
        default: 'false'

# Skip benchmark if commit message contains [skip bench]
concurrency:
  group: benchmark-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Check if benchmarks exist and can compile
  benchmark-check:
    name: Benchmark Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Skip if [skip bench] in commit message
        id: check-skip
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[skip bench]"* ]]; then
            echo "skip_bench=true" >> $GITHUB_OUTPUT
          else
            echo "skip_bench=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        if: steps.check-skip.outputs.skip_bench != 'true'
        with:
          toolchain: stable
          cache-key: bench-check

      - name: Check benchmarks compilation
        if: steps.check-skip.outputs.skip_bench != 'true'
        run: cargo bench --manifest-path rust/Cargo.toml --no-run --verbose

  # Run benchmarks on current branch
  run-benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    needs: [benchmark-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          cache-key: bench-run

      - name: Run benchmarks
        run: |
          cargo bench --manifest-path rust/Cargo.toml -- --output-format bencher | tee /tmp/current-benchmark.txt

      - name: Convert results to JSON
        run: |
          python3 << 'EOF'
          import json
          import re
          from datetime import datetime

          results = {}
          with open('/tmp/current-benchmark.txt', 'r') as f:
              for line in f:
                  # Parse: test name ... bench: X ns/iter (+/- Y)
                  match = re.search(r'test\s+(\S+)\s+.*bench:\s+([\d,]+)\s+ns/iter', line)
                  if match:
                      name = match.group(1)
                      time_ns = int(match.group(2).replace(',', ''))
                      results[name] = {
                          'time_ns': time_ns,
                          'time_us': time_ns / 1000,
                          'time_ms': time_ns / 1_000_000
                      }

          data = {
              'version': '${{ github.ref_name }}',
              'commit': '${{ github.sha }}'[:7],
              'timestamp': datetime.utcnow().isoformat() + 'Z',
              'platform': 'ubuntu-latest',
              'rustc': 'stable',
              'results': results
          }

          with open('/tmp/benchmark-results.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f"Converted {len(results)} benchmarks to JSON")
          EOF

      - name: Archive benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            /tmp/current-benchmark.txt
            /tmp/benchmark-results.json
          retention-days: 90

  # Compare benchmarks for PRs
  benchmark-compare:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [benchmark-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          cache-key: bench-compare

      - name: Run benchmarks on base branch
        run: |
          git stash
          git checkout origin/${{ github.base_ref }}
          echo "Running benchmarks on base branch (${{ github.base_ref }})..."
          cargo bench --manifest-path rust/Cargo.toml -- --output-format bencher > /tmp/base-benchmark.txt 2>&1 || true
          git checkout -
          git stash pop || true

      - name: Run benchmarks on PR branch
        run: |
          echo "Running benchmarks on PR branch..."
          cargo bench --manifest-path rust/Cargo.toml -- --output-format bencher > /tmp/pr-benchmark.txt 2>&1 || true

      - name: Compare benchmark results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Parse bencher format: "test name ... bench: X ns/iter (+/- Y)"
            function parseBenchmarks(content) {
              const results = {};
              const lines = content.split('\n');
              for (const line of lines) {
                const match = line.match(/test\s+(\S+)\s+.*bench:\s+([\d,]+)\s+ns\/iter/);
                if (match) {
                  const name = match[1];
                  const time = parseInt(match[2].replace(/,/g, ''));
                  results[name] = time;
                }
              }
              return results;
            }

            function formatTime(ns) {
              if (ns < 1000) return ns.toFixed(1) + 'ns';
              if (ns < 1_000_000) return (ns / 1000).toFixed(1) + 'µs';
              return (ns / 1_000_000).toFixed(1) + 'ms';
            }

            let baseBench = '';
            let prBench = '';

            if (fs.existsSync('/tmp/base-benchmark.txt')) {
              baseBench = fs.readFileSync('/tmp/base-benchmark.txt', 'utf8');
            }

            if (fs.existsSync('/tmp/pr-benchmark.txt')) {
              prBench = fs.readFileSync('/tmp/pr-benchmark.txt', 'utf8');
            }

            const baseResults = parseBenchmarks(baseBench);
            const prResults = parseBenchmarks(prBench);

            let comment = '## 🚀 Performance Comparison\n\n';
            let hasWarning = false;
            let hasError = false;
            let warningDetails = [];
            let errorDetails = [];

            if (Object.keys(baseResults).length > 0 && Object.keys(prResults).length > 0) {
              comment += '| Benchmark | main | PR | Change | Status |\n';
              comment += '|-----------|------|----|---------|---------|\n';

              for (const [name, prTime] of Object.entries(prResults)) {
                if (baseResults[name]) {
                  const baseTime = baseResults[name];
                  const diff = ((prTime - baseTime) / baseTime * 100).toFixed(1);
                  const diffNum = parseFloat(diff);

                  // Determine status
                  let status = '✅';
                  if (diffNum > 10) {
                    status = '❌';
                    hasError = true;
                    errorDetails.push(`${name}: +${diff}%`);
                  } else if (diffNum > 5) {
                    status = '⚠️';
                    hasWarning = true;
                    warningDetails.push(`${name}: +${diff}%`);
                  } else if (diffNum < 0) {
                    status = '🟢';
                  }

                  const shortName = name.split('::').pop();
                  comment += `| ${shortName} | ${formatTime(baseTime)} | ${formatTime(prTime)} | ${diff > 0 ? '+' : ''}${diff}% | ${status} |\n`;
                }
              }

              // Summary
              comment += '\n## Summary\n\n';
              if (hasError) {
                comment += '### ❌ Critical Performance Regression Detected!\n\n';
                comment += 'The following benchmarks exceeded 10% regression threshold:\n';
                for (const detail of errorDetails) {
                  comment += `- **${detail}**\n`;
                }
                comment += '\n**This PR should not be merged without investigation.**\n';
              } else if (hasWarning) {
                comment += '### ⚠️ Performance Regression Warning\n\n';
                comment += 'The following benchmarks show 5-10% regression:\n';
                for (const detail of warningDetails) {
                  comment += `- ${detail}\n`;
                }
                comment += '\n**Please verify this is acceptable before merging.**\n';
              } else {
                comment += '### ✅ Performance Check Passed\n\n';
                comment += 'No significant performance regressions detected.\n';
              }
            } else if (prBench) {
              comment += '### ℹ️ PR Branch Benchmarks\n```\n';
              comment += prBench.substring(0, 2000);
              comment += prBench.length > 2000 ? '\n... (truncated)\n```' : '\n```';
            } else {
              comment += '⚠️ No benchmark results to compare.\n';
            }

            comment += '\n<details><summary>Full output</summary>\n\n```\n';
            comment += prBench.substring(0, 5000);
            comment += '\n```\n</details>';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

            if (hasError) {
              core.setFailed(`Critical performance regression detected (>10%): ${errorDetails.join(', ')}`);
            }

      - name: Convert PR results to JSON
        if: always()
        run: |
          python3 << 'EOF'
          import json
          import re
          from datetime import datetime
          import os

          def parse_results(filename):
              results = {}
              if os.path.exists(filename):
                  with open(filename, 'r') as f:
                      for line in f:
                          match = re.search(r'test\s+(\S+)\s+.*bench:\s+([\d,]+)\s+ns/iter', line)
                          if match:
                              name = match.group(1)
                              time_ns = int(match.group(2).replace(',', ''))
                              results[name] = {
                                  'time_ns': time_ns,
                                  'time_us': time_ns / 1000,
                                  'time_ms': time_ns / 1_000_000
                              }
              return results

          base_results = parse_results('/tmp/base-benchmark.txt')
          pr_results = parse_results('/tmp/pr-benchmark.txt')

          comparison = {
              'pr_number': ${{ github.event.pull_request.number }},
              'base_branch': '${{ github.base_ref }}',
              'pr_branch': '${{ github.head_ref }}',
              'base_commit': '${{ github.base_ref }}'[:7],
              'pr_commit': '${{ github.sha }}'[:7],
              'timestamp': datetime.utcnow().isoformat() + 'Z',
              'base_results': base_results,
              'pr_results': pr_results,
              'comparison': {}
          }

          for name, pr_data in pr_results.items():
              if name in base_results:
                  base_data = base_results[name]
                  diff_ns = pr_data['time_ns'] - base_data['time_ns']
                  diff_pct = (diff_ns / base_data['time_ns'] * 100) if base_data['time_ns'] > 0 else 0
                  comparison['comparison'][name] = {
                      'base_ns': base_data['time_ns'],
                      'pr_ns': pr_data['time_ns'],
                      'diff_ns': diff_ns,
                      'diff_pct': round(diff_pct, 1),
                      'status': 'error' if diff_pct > 10 else 'warning' if diff_pct > 5 else 'pass'
                  }

          with open('/tmp/benchmark-comparison.json', 'w') as f:
              json.dump(comparison, f, indent=2)

          print(f"Comparison saved: {len(comparison['comparison'])} benchmarks")
          EOF

      - name: Upload comparison results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-comparison-${{ github.run_id }}
          path: |
            /tmp/base-benchmark.txt
            /tmp/pr-benchmark.txt
            /tmp/benchmark-comparison.json
          retention-days: 90

  # Create issue on critical regression for scheduled runs
  regression-alert:
    name: Regression Alert
    runs-on: ubuntu-latest
    needs: [run-benchmarks]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_issue_on_regression == 'true')
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download benchmark results
        uses: actions/download-artifact@v5
        with:
          name: benchmark-results-${{ github.run_id }}
          path: /tmp

      - name: Check for regression and create issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read current results
            let currentResults = {};
            if (fs.existsSync('/tmp/benchmark-results.json')) {
              const data = JSON.parse(fs.readFileSync('/tmp/benchmark-results.json', 'utf8'));
              currentResults = data.results || {};
            }

            // Read previous baseline (if exists)
            let baseline = {};
            if (fs.existsSync('docs/book/src/benchmarks/baseline.json')) {
              baseline = JSON.parse(fs.readFileSync('docs/book/src/benchmarks/baseline.json', 'utf8'));
            }

            // Compare and detect regressions
            const regressions = [];
            for (const [name, current] of Object.entries(currentResults)) {
              if (baseline[name]) {
                const baselineNs = baseline[name].time_ns;
                const currentNs = current.time_ns;
                const diffPct = ((currentNs - baselineNs) / baselineNs * 100);

                if (diffPct > 15) {  // Critical: >15% regression
                  regressions.push({
                    name: name,
                    baseline: baselineNs,
                    current: currentNs,
                    diff: diffPct.toFixed(1)
                  });
                }
              }
            }

            if (regressions.length > 0) {
              const body = `## 🚨 Performance Regression Alert

              **Date:** ${new Date().toISOString().split('T')[0]}
              **Commit:** \`${{ github.sha }}\`
              **Run:** [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

              ### Critical Regressions Detected (>15%)

              | Benchmark | Baseline | Current | Regression |
              |-----------|----------|---------|------------|
              ${regressions.map(r => `| ${r.name.split('::').pop()} | ${(r.baseline/1000).toFixed(1)}µs | ${(r.current/1000).toFixed(1)}µs | **+${r.diff}%** |`).join('\n')}

              ### Action Required
              1. Review recent commits for performance-impacting changes
              2. Run local benchmarks to reproduce
              3. Update baseline if regression is acceptable

              /label performance, regression`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Performance Regression Detected: ${regressions.length} benchmark(s)`,
                body: body,
                labels: ['performance', 'regression', 'automated']
              });

              core.warning(`Created issue for ${regressions.length} performance regressions`);
            } else {
              console.log('No critical regressions detected');
            }

  # Archive dashboard data as artifact (no auto-commit to main)
  archive-dashboard:
    name: Archive Dashboard Data
    runs-on: ubuntu-latest
    needs: [run-benchmarks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download benchmark results
        uses: actions/download-artifact@v5
        with:
          name: benchmark-results-${{ github.run_id }}
          path: /tmp

      - name: Generate dashboard data
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime

          # Ensure directory exists
          os.makedirs('docs/book/src/benchmarks', exist_ok=True)

          # Read JSON results
          if os.path.exists('/tmp/benchmark-results.json'):
              with open('/tmp/benchmark-results.json', 'r') as f:
                  data = json.load(f)
          else:
              data = {
                  'version': '${{ github.ref_name }}',
                  'timestamp': datetime.utcnow().isoformat() + 'Z',
                  'commit': '${{ github.sha }}'[:7],
                  'results': {}
              }

          # Write to dashboard file
          output_file = 'docs/book/src/benchmarks/latest.json'
          with open(output_file, 'w') as f:
              json.dump(data, f, indent=2)

          print(f'Dashboard data updated: {len(data.get("results", {}))} benchmarks')
          EOF

      - name: Archive dashboard data as artifact
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-dashboard-${{ github.run_id }}
          path: docs/book/src/benchmarks/latest.json
          retention-days: 90

  # Extended benchmarks (optional, for scheduled runs or manual trigger)
  extended-benchmarks:
    name: Extended Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.full_bench == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          cache-key: bench-extended

      - name: Run extended benchmarks
        run: |
          cargo bench --manifest-path rust/Cargo.toml --verbose -- --output-format bencher | tee /tmp/extended-benchmark.txt

      - name: Archive extended results
        uses: actions/upload-artifact@v5
        with:
          name: extended-benchmarks-${{ github.run_id }}
          path: /tmp/extended-benchmark.txt
          retention-days: 90

  # Full-dictionary benchmarks (optional, workflow_dispatch only — avoids 50MB download on every commit)
  full-dict-benchmark:
    name: Full-Dict Benchmarks
    runs-on: ubuntu-latest
    if: github.event.inputs.full_dict == 'true'
    needs: [benchmark-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          cache-key: bench-full-dict

      - name: Download full Korean dictionary
        id: download-dict
        continue-on-error: true
        run: |
          mkdir -p data
          EXPECTED_SHA256="fd62d3d6d8fa85145528065fabad4d7cb20f6b2201e71be4081a4e9701a5b330"
          echo "Downloading mecab-ko-dic-2.1.1-20180720.tar.gz (~50MB)..."
          if ! curl --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 \
              -L -o data/mecab-ko-dic-2.1.1-20180720.tar.gz \
              "https://bitbucket.org/eunjeon/mecab-ko-dic/downloads/mecab-ko-dic-2.1.1-20180720.tar.gz"; then
            echo "::error::Failed to download full dictionary archive."
            exit 1
          fi
          ACTUAL_SHA256=$(sha256sum data/mecab-ko-dic-2.1.1-20180720.tar.gz | awk '{print $1}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::SHA256 checksum mismatch! Expected: $EXPECTED_SHA256, Got: $ACTUAL_SHA256"
            rm -f data/mecab-ko-dic-2.1.1-20180720.tar.gz
            exit 1
          fi
          echo "SHA256 verified. Extracting..."
          tar xzf data/mecab-ko-dic-2.1.1-20180720.tar.gz -C data/
          echo "Extracted to data/mecab-ko-dic-2.1.1-20180720/"
          ls -lh data/mecab-ko-dic-2.1.1-20180720/ | head -20

      - name: Build dict-builder
        if: steps.download-dict.outcome == 'success'
        run: |
          cargo build --manifest-path rust/Cargo.toml \
            --release \
            --bin mecab-ko-dict-builder \
            --verbose

      - name: Build full dictionary
        if: steps.download-dict.outcome == 'success'
        run: |
          mkdir -p data/dict-output
          cargo run --manifest-path rust/Cargo.toml \
            --release \
            --bin mecab-ko-dict-builder \
            -- \
            --input ./data/mecab-ko-dic-2.1.1-20180720 \
            --output ./data/dict-output \
            --verbose
          echo "=== Generated dictionary files ==="
          ls -lh data/dict-output/

      - name: Run benchmarks with full dictionary
        if: steps.download-dict.outcome == 'success'
        run: |
          MECAB_DICDIR=data/dict-output \
            cargo bench --manifest-path rust/Cargo.toml -- --output-format bencher \
            | tee /tmp/full-dict-benchmark.txt

      - name: Upload full-dict benchmark results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: full-dict-benchmarks-${{ github.run_id }}
          path: /tmp/full-dict-benchmark.txt
          retention-days: 90
