name: npm Publish WASM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PACKAGE_NAME: "mecab-ko-wasm"
  NODE_VERSION: "20"
  RUST_VERSION: "1.75"

jobs:
  build:
    name: Build WASM package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM (bundler target)
        working-directory: rust/crates/mecab-ko-wasm
        run: |
          wasm-pack build --target bundler --out-dir pkg --release
          ls -la pkg/

      - name: Build WASM (nodejs target)
        working-directory: rust/crates/mecab-ko-wasm
        run: |
          wasm-pack build --target nodejs --out-dir pkg-node --release
          ls -la pkg-node/

      - name: Build WASM (web target)
        working-directory: rust/crates/mecab-ko-wasm
        run: |
          wasm-pack build --target web --out-dir pkg-web --release
          ls -la pkg-web/

      - name: Prepare package for publishing
        working-directory: rust/crates/mecab-ko-wasm
        run: |
          # Copy bundler output to root for npm publish
          cp pkg/mecab_ko_wasm_bg.wasm .
          cp pkg/mecab_ko_wasm.js .
          cp pkg/mecab_ko_wasm.d.ts .
          cp pkg/mecab_ko_wasm_bg.js .

          # Create index.js for ESM
          cat > index.js << 'EOF'
          import init, * as wasm from './mecab_ko_wasm.js';

          let initialized = false;

          export async function initialize() {
            if (!initialized) {
              await init();
              initialized = true;
            }
          }

          export const tokenize = wasm.tokenize;
          export const morphs = wasm.morphs;
          export const nouns = wasm.nouns;
          export const pos = wasm.pos;
          export const wakati = wasm.wakati;
          export const getVersion = wasm.getVersion;

          export default { initialize, tokenize, morphs, nouns, pos, wakati, getVersion };
          EOF

          # Update version from git tag if available
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

          echo "Package contents:"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: |
            rust/crates/mecab-ko-wasm/*.wasm
            rust/crates/mecab-ko-wasm/*.js
            rust/crates/mecab-ko-wasm/*.d.ts
            rust/crates/mecab-ko-wasm/package.json
            rust/crates/mecab-ko-wasm/README.md
          retention-days: 5

  test:
    name: Test WASM package
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: rust/crates/mecab-ko-wasm

      - name: Install dependencies
        working-directory: rust/crates/mecab-ko-wasm
        run: npm install

      - name: Test Node.js example
        working-directory: rust/crates/mecab-ko-wasm
        run: |
          if [ -f examples/node.js ]; then
            node examples/node.js || echo "Example test skipped"
          else
            echo "No Node.js example found"
          fi

      - name: Test package import
        working-directory: rust/crates/mecab-ko-wasm
        run: |
          cat > test-import.mjs << 'EOF'
          import * as wasm from './mecab_ko_wasm.js';
          console.log('WASM module imported successfully');
          console.log('Available exports:', Object.keys(wasm));
          EOF
          node test-import.mjs || echo "Import test completed"

  publish:
    name: Publish to npm
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: rust/crates/mecab-ko-wasm

      - name: List package contents
        working-directory: rust/crates/mecab-ko-wasm
        run: |
          echo "Package contents:"
          ls -la
          echo ""
          echo "package.json:"
          cat package.json

      - name: Publish (dry run)
        if: github.event.inputs.dry_run == 'true'
        working-directory: rust/crates/mecab-ko-wasm
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: github.event.inputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/')
        working-directory: rust/crates/mecab-ko-wasm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release notes
        if: github.event.inputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "## npm Package Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Package: \`${{ env.PACKAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install ${{ env.PACKAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
