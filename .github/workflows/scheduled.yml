name: Scheduled Tasks

on:
  schedule:
    # Daily security check at 00:00 UTC
    - cron: '0 0 * * *'
    # Weekly comprehensive audit on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  daily-security-audit:
    name: Daily Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run security audit
        uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo deny
        run: cargo deny --manifest-path rust/Cargo.toml check all
        continue-on-error: true

      - name: Create issue on vulnerability found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security: Vulnerability detected in dependencies',
              body: 'Daily security audit found vulnerabilities. Please check the workflow run for details.',
              labels: ['security', 'automated']
            });

  weekly-dependency-update-check:
    name: Weekly Dependency Check
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated
          cargo outdated --manifest-path rust/Cargo.toml --format list > outdated.txt || true
          cat outdated.txt

      - name: Upload outdated dependencies report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdated-dependencies
          path: outdated.txt
          retention-days: 7

      - name: Create issue if updates available
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('outdated.txt', 'utf8');

            if (content.trim().length > 0) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Maintenance: Outdated dependencies available',
                body: '## Outdated Dependencies\n\n```\n' + content + '\n```\n\nPlease review and update as necessary.',
                labels: ['maintenance', 'automated']
              });
            }
        continue-on-error: true

  weekly-compilation-test:
    name: Weekly Comprehensive Test
    runs-on: ${{ matrix.os }}
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-weekly-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-weekly-${{ matrix.rust }}-

      - name: Run full test suite
        run: |
          cargo test --manifest-path rust/Cargo.toml --all-features --verbose
          cargo test --manifest-path rust/Cargo.toml --release --verbose
        continue-on-error: true

      - name: Run clippy on all targets
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
        continue-on-error: true

  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            rustdoc
            mdbook
            documentation
          minAgeInDays: 30

  status-check:
    name: Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get repository info
        id: repo_info
        run: |
          echo "last_commit=$(git log -1 --pretty=%H)" >> $GITHUB_OUTPUT
          echo "last_commit_date=$(git log -1 --pretty=%ai)" >> $GITHUB_OUTPUT

      - name: Create status report
        run: |
          cat > status.md << 'EOF'
          # Repository Status Report

          Generated: $(date)

          ## Information
          - Last Commit: ${{ steps.repo_info.outputs.last_commit }}
          - Last Commit Date: ${{ steps.repo_info.outputs.last_commit_date }}

          ## Workflow Status
          - CI: Monitoring
          - Docs: Monitoring
          - Release: Ready

          ## Next Steps
          - Monitor security vulnerabilities
          - Review outdated dependencies
          - Plan releases
          EOF

      - name: Upload status report
        uses: actions/upload-artifact@v4
        with:
          name: status-report
          path: status.md
          retention-days: 30
