name: Scheduled Tasks

on:
  schedule:
    # Weekly comprehensive audit on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  weekly-compilation-test:
    name: Weekly Comprehensive Test
    runs-on: ${{ matrix.os }}
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ matrix.rust }}
          cache-key: weekly-${{ matrix.rust }}

      - name: Run full test suite
        run: |
          cargo test --manifest-path rust/Cargo.toml --features hot-reload-v2 --verbose
          cargo test --manifest-path rust/Cargo.toml --release --verbose
        continue-on-error: true

      - name: Run clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --lib --bins --features hot-reload-v2 -- -D warnings
        continue-on-error: true

  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            rustdoc
            mdbook
            documentation
          failOnError: false

  status-check:
    name: Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get repository info
        id: repo_info
        run: |
          echo "last_commit=$(git log -1 --pretty=%H)" >> $GITHUB_OUTPUT
          echo "last_commit_date=$(git log -1 --pretty=%ai)" >> $GITHUB_OUTPUT

      - name: Create status report
        run: |
          cat > status.md << 'EOF'
          # Repository Status Report

          Generated: $(date)

          ## Information
          - Last Commit: ${{ steps.repo_info.outputs.last_commit }}
          - Last Commit Date: ${{ steps.repo_info.outputs.last_commit_date }}

          ## Workflow Status
          - CI: Monitoring
          - Docs: Monitoring
          - Release: Ready

          ## Next Steps
          - Monitor security vulnerabilities
          - Review outdated dependencies
          - Plan releases
          EOF

      - name: Upload status report
        uses: actions/upload-artifact@v5
        with:
          name: status-report
          path: status.md
          retention-days: 30

  competitor-review:
    name: Regenerate Competitor Review
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh external gold-set F1 (only if compiled dict is present)
        run: |
          if [ -d data/dict-output ] && [ -f rust/target/release/mecab ]; then
            echo "Compiled dict + CLI present — measuring F1"
            python3 scripts/review/measure_f1.py
          else
            echo "No compiled dict/CLI in CI — keeping committed mecab_f1.json"
          fi
        continue-on-error: true

      - name: Regenerate garu vs mecab-ko review
        run: python3 scripts/review/competitor_review.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain docs/research/competitor-analysis)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/research/competitor-analysis
            git commit -m "docs: refresh competitor review (garu vs mecab-ko) [skip ci]"
            git push
          else
            echo "No changes in competitor review."
          fi
