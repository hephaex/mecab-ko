name: Scheduled Tasks

on:
  schedule:
    # Weekly comprehensive audit on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  weekly-compilation-test:
    name: Weekly Comprehensive Test
    runs-on: ${{ matrix.os }}
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-weekly-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-weekly-${{ matrix.rust }}-

      - name: Run full test suite
        run: |
          cargo test --manifest-path rust/Cargo.toml --features hot-reload-v2 --verbose
          cargo test --manifest-path rust/Cargo.toml --release --verbose
        continue-on-error: true

      - name: Run clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --lib --bins --features hot-reload-v2 -- -D warnings
        continue-on-error: true

  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            rustdoc
            mdbook
            documentation
          failOnError: false

  status-check:
    name: Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get repository info
        id: repo_info
        run: |
          echo "last_commit=$(git log -1 --pretty=%H)" >> $GITHUB_OUTPUT
          echo "last_commit_date=$(git log -1 --pretty=%ai)" >> $GITHUB_OUTPUT

      - name: Create status report
        run: |
          cat > status.md << 'EOF'
          # Repository Status Report

          Generated: $(date)

          ## Information
          - Last Commit: ${{ steps.repo_info.outputs.last_commit }}
          - Last Commit Date: ${{ steps.repo_info.outputs.last_commit_date }}

          ## Workflow Status
          - CI: Monitoring
          - Docs: Monitoring
          - Release: Ready

          ## Next Steps
          - Monitor security vulnerabilities
          - Review outdated dependencies
          - Plan releases
          EOF

      - name: Upload status report
        uses: actions/upload-artifact@v4
        with:
          name: status-report
          path: status.md
          retention-days: 30
