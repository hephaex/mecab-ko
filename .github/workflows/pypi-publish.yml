name: PyPI Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: 'false'

env:
  PACKAGE_NAME: mecab-ko-python
  PYTHON_VERSION: "3.11"

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
          # macOS x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up QEMU (for aarch64 on Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels (Linux)
        if: matrix.platform == 'linux'
        working-directory: rust/crates/mecab-ko-python
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # Use manylinux container for cross-compilation on Linux aarch64
            docker run --rm -v $(pwd):/io \
              --workdir /io \
              ghcr.io/pyo3/maturin:latest \
              build --release \
              --target ${{ matrix.target }} \
              --out dist \
              --strip \
              --compatibility manylinux_2_28
          else
            maturin build --release \
              --target ${{ matrix.target }} \
              --out dist \
              --strip
          fi
        shell: bash

      - name: Build wheels (macOS)
        if: matrix.platform == 'macos'
        working-directory: rust/crates/mecab-ko-python
        run: |
          maturin build --release \
            --target ${{ matrix.target }} \
            --out dist \
            --strip

      - name: Build wheels (Windows)
        if: matrix.platform == 'windows'
        working-directory: rust/crates/mecab-ko-python
        run: |
          maturin build --release `
            --target ${{ matrix.target }} `
            --out dist `
            --strip

      - name: List built wheels
        working-directory: rust/crates/mecab-ko-python
        run: ls -lh dist/
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: rust/crates/mecab-ko-python/dist/*.whl
          retention-days: 5

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        working-directory: rust/crates/mecab-ko-python
        run: maturin sdist --out dist

      - name: List built sdist
        working-directory: rust/crates/mecab-ko-python
        run: ls -lh dist/

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: rust/crates/mecab-ko-python/dist/*.tar.gz
          retention-days: 5

  test-wheels:
    name: Test wheel on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        exclude:
          # macOS 14 (Apple Silicon) requires Python 3.10+
          - os: macos-14
            python-version: "3.8"
          - os: macos-14
            python-version: "3.9"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Install wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          pip install --find-links dist --no-index ${{ env.PACKAGE_NAME }}
        shell: bash

      - name: Install wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install --find-links dist --no-index ${{ env.PACKAGE_NAME }}
        shell: pwsh

      - name: Test import
        run: |
          python -c "from mecab_ko import Mecab; print('Import successful')"
          python -c "from mecab_ko import __version__; print(f'Version: {__version__}')"

      - name: Run basic tests
        run: |
          python -c "
          from mecab_ko import Mecab
          mecab = Mecab()

          # Test morphs
          result = mecab.morphs('안녕하세요')
          print(f'morphs: {result}')
          assert isinstance(result, list)
          assert len(result) > 0

          # Test nouns
          result = mecab.nouns('아버지가방에들어가신다')
          print(f'nouns: {result}')
          assert isinstance(result, list)

          # Test pos
          result = mecab.pos('나는 학생입니다')
          print(f'pos: {result}')
          assert isinstance(result, list)
          assert all(isinstance(item, tuple) and len(item) == 2 for item in result)

          # Test parse
          result = mecab.parse('안녕')
          print(f'parse: {result}')
          assert isinstance(result, str)
          assert 'EOS' in result

          print('All tests passed!')
          "

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # For trusted publishing
      contents: write  # For creating releases
    environment:
      name: pypi
      url: https://pypi.org/project/${{ env.PACKAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Prepare distribution files
        run: |
          mkdir -p dist
          find dist-artifacts -name '*.whl' -exec cp {} dist/ \;
          find dist-artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Publish to TestPyPI
        if: github.event.inputs.test_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Publish to PyPI
        if: github.event.inputs.test_pypi != 'true' && startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-pypi:
    name: Verify PyPI package
    needs: [publish-to-pypi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Wait for PyPI to update
        run: sleep 120

      - name: Install from PyPI
        run: |
          pip install --upgrade pip
          pip install ${{ env.PACKAGE_NAME }}

      - name: Verify installation
        run: |
          python -c "from mecab_ko import Mecab, __version__; print(f'Installed version: {__version__}')"
          python -c "from mecab_ko import Mecab; mecab = Mecab(); print(mecab.morphs('테스트'))"

      - name: Display package info
        run: pip show ${{ env.PACKAGE_NAME }}
