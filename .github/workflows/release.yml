name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (without v prefix)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            head -50 CHANGELOG.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "body=See commit history for changes" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.tag) }}
          release_name: Release ${{ github.ref_name || github.event.inputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mecab-ko
            asset_name: mecab-ko-x86_64-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: mecab-ko
            asset_name: mecab-ko-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: mecab-ko
            asset_name: mecab-ko-x86_64-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mecab-ko
            asset_name: mecab-ko-aarch64-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mecab-ko.exe
            asset_name: mecab-ko-x86_64-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.target != 'x86_64-pc-windows-msvc' && matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-apple-darwin'
        run: cargo install cross

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: rust/target
          key: ${{ matrix.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-release-${{ matrix.target }}-

      - name: Build CLI release
        run: cargo build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }} --bin mecab-ko-cli
        env:
          RUSTFLAGS: "-C target-cpu=generic"

      - name: Create release assets directory
        run: mkdir -p release-assets

      - name: Prepare assets (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp rust/target/${{ matrix.target }}/release/mecab-ko-cli release-assets/${{ matrix.asset_name }}
          chmod +x release-assets/${{ matrix.asset_name }}
          cd release-assets
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}
          ls -lh

      - name: Prepare assets (Windows)
        if: runner.os == 'Windows'
        run: |
          copy rust/target/${{ matrix.target }}/release/mecab-ko-cli.exe release-assets/${{ matrix.asset_name }}.exe
          cd release-assets
          powershell Compress-Archive -Path ${{ matrix.asset_name }}.exe -DestinationPath ${{ matrix.asset_name }}.zip
          dir

      - name: Upload Linux/macOS asset
        if: runner.os != 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-assets/${{ matrix.asset_name }}.tar.gz
          asset_name: ${{ matrix.asset_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Windows asset
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-assets/${{ matrix.asset_name }}.zip
          asset_name: ${{ matrix.asset_name }}.zip
          asset_content_type: application/zip

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace packages
        run: |
          cargo publish --manifest-path rust/Cargo.toml --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty
        continue-on-error: true

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-release]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-release.result }}" == "failure" ]; then
            echo "Release build failed!"
            exit 1
          else
            echo "Release build completed successfully!"
          fi
