name: CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'rust/**'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'rust/**'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  # Fast checks that run in parallel
  fmt:
    name: Rustfmt Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        working-directory: rust
        run: cargo fmt -- --check

  clippy:
    name: Clippy Lint (Library Crates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          components: clippy

      - name: Run clippy on library crates
        # Library + binary targets only (tests/examples use unwrap/expect legitimately)
        # simd feature excluded (requires nightly)
        run: |
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --lib --bins \
            --features hot-reload-v2 \
            -- -D warnings

  # Test suite on primary platform with all toolchains
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # nightly is informational — allow it to fail without blocking CI gate
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ matrix.rust }}
          cache-key: ${{ matrix.rust }}

      - name: Run tests (debug)
        run: |
          cargo test \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --verbose
        env:
          RUST_BACKTRACE: full

      - name: Run tests (release)
        run: |
          cargo test \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --release \
            --verbose

  # Async feature tests (tokio-based)
  async-tests:
    name: Async Feature Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          cache-key: async

      - name: Run async feature tests
        run: |
          cargo test \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-core \
            --features async

  # Profiler tests with test-allocator (isolated due to global allocator)
  profiler-allocator:
    name: Profiler Allocator Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable

      - name: Run profiler test-allocator tests
        run: |
          cargo test \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-profiler \
            --features test-allocator \
            -- --test-threads=1

  # Multi-platform build test (core crates only)
  build:
    name: Build [${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.os }}

      - name: Build (release)
        shell: bash
        run: |
          cargo build \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --release \
            --verbose

  # Code coverage (core crates only)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: |
          cargo tarpaulin \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --out Xml \
            --timeout 300 \
            --exclude-files tests/* benches/*

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  mini-dict-sync:
    name: Mini-dict Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          cache-key: mini-dict

      - name: Build create_mini_dict
        working-directory: rust/test-fixtures
        run: cargo build --release

      - name: Regenerate and diff
        run: |
          mkdir -p /tmp/mini-dict-check
          cd rust/test-fixtures
          ./target/release/create_mini_dict /tmp/mini-dict-check

          for FILE in entries.csv entries.bin sys.dic matrix.bin; do
            if [ -f "mini-dict/$FILE" ] && [ -f "/tmp/mini-dict-check/$FILE" ]; then
              if ! diff -q "mini-dict/$FILE" "/tmp/mini-dict-check/$FILE" >/dev/null 2>&1; then
                echo "::error::mini-dict/$FILE is out of sync with create_mini_dict output"
                echo "Run: cd rust/test-fixtures && cargo run --release -- mini-dict"
                exit 1
              fi
              echo "✓ $FILE in sync"
            fi
          done
          echo "All mini-dict files in sync"

  # Summary of all checks
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, async-tests, profiler-allocator, build, coverage, mini-dict-sync]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          # Check if all required jobs passed
          if [[ "${{ needs.fmt.result }}" != "success" ||
                "${{ needs.clippy.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.async-tests.result }}" != "success" ||
                "${{ needs.profiler-allocator.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.coverage.result }}" != "success" ||
                "${{ needs.mini-dict-sync.result }}" != "success" ]]; then
            echo "CI Status: FAILED"
            echo "Some checks did not pass. Please review the logs."
            exit 1
          fi
          echo "CI Status: SUCCESS"
          echo "All checks passed!"
