name: CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'rust/**'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'rust/**'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  # Fast checks that run in parallel
  fmt:
    name: Rustfmt Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

  clippy:
    name: Clippy Lint (Library Crates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run clippy on library crates
        # Exclude FFI crates that need special environments:
        # - mecab-ko-python (needs Python)
        # - mecab-ko-node (needs Node.js)
        # - mecab-ko-wasm (needs wasm-pack/clang)
        # - mecab-ko-elasticsearch (needs JDK)
        run: |
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --exclude mecab-ko-python \
            --exclude mecab-ko-node \
            --exclude mecab-ko-wasm \
            --exclude mecab-ko-elasticsearch \
            --all-targets \
            --all-features \
            -- -D warnings

  # Test suite on primary platform with all toolchains
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.rust }}

      - name: Run tests (debug)
        # Exclude FFI crates that need special environments
        run: |
          cargo test \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --exclude mecab-ko-python \
            --exclude mecab-ko-node \
            --exclude mecab-ko-wasm \
            --exclude mecab-ko-elasticsearch \
            --verbose
        env:
          RUST_BACKTRACE: full

      - name: Run tests (release)
        # Exclude FFI crates that need special environments
        run: |
          cargo test \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --exclude mecab-ko-python \
            --exclude mecab-ko-node \
            --exclude mecab-ko-wasm \
            --exclude mecab-ko-elasticsearch \
            --release \
            --verbose

  # Documentation generation
  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Generate documentation
        run: |
          cargo doc \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --exclude mecab-ko-python \
            --exclude mecab-ko-node \
            --exclude mecab-ko-wasm \
            --exclude mecab-ko-elasticsearch \
            --no-deps \
            --release
        env:
          RUSTDOCFLAGS: -D warnings

  # Multi-platform build test (core crates only)
  build:
    name: Build [${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.os }}

      - name: Build (release)
        # Exclude FFI crates that need special environments
        run: |
          cargo build \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --exclude mecab-ko-python \
            --exclude mecab-ko-node \
            --exclude mecab-ko-wasm \
            --exclude mecab-ko-elasticsearch \
            --release \
            --verbose

  # Security scanning
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run RustSec audit check
        uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: |
          cargo audit \
            --manifest-path rust/Cargo.toml \
            --deny warnings

  # Code coverage (core crates only)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Generate coverage
        run: |
          cargo tarpaulin \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --exclude mecab-ko-python \
            --exclude mecab-ko-node \
            --exclude mecab-ko-wasm \
            --exclude mecab-ko-elasticsearch \
            --out Xml \
            --timeout 300 \
            --exclude-files tests/* benches/*

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Summary of all checks
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, build, docs, security-audit, coverage]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          # Check if all required jobs passed
          if [[ "${{ needs.fmt.result }}" != "success" ||
                "${{ needs.clippy.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.docs.result }}" != "success" ||
                "${{ needs.security-audit.result }}" != "success" ||
                "${{ needs.coverage.result }}" != "success" ]]; then
            echo "CI Status: FAILED"
            echo "Some checks did not pass. Please review the logs."
            exit 1
          fi
          echo "CI Status: SUCCESS"
          echo "All checks passed!"
