name: Elasticsearch Plugin Integration Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'search-plugins/**'
      - 'rust/crates/mecab-ko-elasticsearch/**'
      - '.github/workflows/elasticsearch-plugin-tests.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'search-plugins/**'
      - 'rust/crates/mecab-ko-elasticsearch/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ELASTICSEARCH_VERSION: '8.11.3'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: elasticsearch-plugin
        run: chmod +x gradlew || true

      - name: Run unit tests
        working-directory: elasticsearch-plugin
        run: ./gradle test --no-daemon || gradle test --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: elasticsearch-plugin/build/reports/tests/test/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust native library
        working-directory: rust
        run: |
          cargo build --release
          ls -la target/release/

      - name: Grant execute permission for gradlew
        working-directory: elasticsearch-plugin
        run: chmod +x gradlew || true

      - name: Run integration tests
        working-directory: elasticsearch-plugin
        run: ./gradle integrationTest --no-daemon || gradle integrationTest --no-daemon
        env:
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: elasticsearch-plugin/build/reports/tests/integrationTest/
          retention-days: 7

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: elasticsearch-plugin/build/testclusters/**/logs/
          retention-days: 7

  compatibility-tests:
    name: Elasticsearch Version Compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        es-version: ['8.11.3', '8.12.0', '8.13.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust native library
        working-directory: rust
        run: cargo build --release

      - name: Test with Elasticsearch ${{ matrix.es-version }}
        working-directory: elasticsearch-plugin
        run: |
          # Update version in build.gradle.kts
          sed -i 's/8\.11\.3/${{ matrix.es-version }}/g' build.gradle.kts
          ./gradle integrationTest --no-daemon || gradle integrationTest --no-daemon
        env:
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust native library
        working-directory: rust
        run: cargo build --release

      - name: Run tests with coverage
        working-directory: elasticsearch-plugin
        run: |
          ./gradle test jacocoTestReport --no-daemon || gradle test jacocoTestReport --no-daemon

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: elasticsearch-plugin/build/reports/jacoco/
          retention-days: 7

  performance-tests:
    name: Performance Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust native library (release mode)
        working-directory: rust
        run: cargo build --release

      - name: Run performance tests
        working-directory: elasticsearch-plugin
        run: |
          ./gradle integrationTest --tests "*Performance*" --no-daemon || \
          gradle integrationTest --tests "*Performance*" --no-daemon

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: elasticsearch-plugin/build/reports/tests/
          retention-days: 30

  docker-test:
    name: Docker Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Elasticsearch container
        run: |
          docker run -d \
            --name elasticsearch \
            -p 9200:9200 \
            -e "discovery.type=single-node" \
            -e "xpack.security.enabled=false" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            docker.elastic.co/elasticsearch/elasticsearch:${{ env.ELASTICSEARCH_VERSION }}

          # Wait for Elasticsearch to be ready
          for i in {1..30}; do
            if curl -s http://localhost:9200 > /dev/null; then
              echo "Elasticsearch is ready"
              break
            fi
            echo "Waiting for Elasticsearch... ($i/30)"
            sleep 2
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build plugin
        working-directory: elasticsearch-plugin
        run: |
          cargo build --release --manifest-path ../rust/Cargo.toml
          ./gradle build --no-daemon || gradle build --no-daemon

      - name: Install plugin in Docker container
        run: |
          docker cp elasticsearch-plugin/build/distributions/*.zip elasticsearch:/tmp/
          docker exec elasticsearch bin/elasticsearch-plugin install file:///tmp/*.zip --batch || true
          docker restart elasticsearch
          sleep 10

      - name: Test plugin installation
        run: |
          curl -X GET "localhost:9200/_cat/plugins?v"

      - name: Stop Elasticsearch
        if: always()
        run: docker stop elasticsearch

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          merge-multiple: true

      - name: Publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
