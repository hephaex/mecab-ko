# Neologism (New Word) Automatic Synchronization Workflow
#
# This workflow automatically collects new Korean words from the National Institute
# of Korean Language (NIKL) OpenDict API and creates PRs to update the dictionary.
#
# Schedule:
#   - Weekly: Every Monday at 09:00 KST (00:00 UTC)
#   - Monthly: First day of each month at 09:00 KST
#
# Manual Trigger:
#   Use workflow_dispatch with custom options
#
# Required Secrets:
#   - OPENDICT_API_KEY: API key from data.go.kr for 우리말샘 API
#   - SLACK_WEBHOOK_URL: (Optional) Slack webhook for failure notifications

name: Neologism Sync

on:
  schedule:
    # Weekly sync: Every Monday at 00:00 UTC (09:00 KST)
    - cron: '0 0 * * 1'
    # Monthly comprehensive sync: First day of month at 00:00 UTC (09:00 KST)
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collection mode'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly
          - custom
      keywords:
        description: 'Custom keywords (comma-separated, for custom mode)'
        required: false
        type: string
      max_entries:
        description: 'Maximum entries to collect'
        required: false
        default: '100'
        type: string
      dry_run:
        description: 'Dry run (collect only, no PR creation)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEOLOGISMS_CSV: data/user-dict/neologisms.csv

jobs:
  # ============================================================================
  # Main Collection Job
  # ============================================================================
  collect-neologisms:
    name: Collect Neologisms
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      new_entries: ${{ steps.collect.outputs.new_entries }}
      has_changes: ${{ steps.check.outputs.has_changes }}
      collection_mode: ${{ steps.setup.outputs.mode }}

    steps:
      # ----------------------------------------------------------------------
      # Setup
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine collection mode
        id: setup
        run: |
          # Determine mode based on schedule or input
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Check if it's the first day of the month
            if [ "$(date +%d)" == "01" ]; then
              MODE="monthly"
            else
              MODE="weekly"
            fi
          else
            MODE="${{ github.event.inputs.mode || 'weekly' }}"
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Collection mode: $MODE"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-neologism-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-neologism-
            ${{ runner.os }}-cargo-

      # ----------------------------------------------------------------------
      # Build CLI
      # ----------------------------------------------------------------------
      - name: Build CLI
        run: |
          cargo build --release --manifest-path rust/Cargo.toml -p mecab-ko-cli
          echo "CLI built successfully"

      # ----------------------------------------------------------------------
      # Check API Key
      # ----------------------------------------------------------------------
      - name: Validate API key
        id: validate_key
        run: |
          if [ -z "${{ secrets.OPENDICT_API_KEY }}" ]; then
            echo "::error::OPENDICT_API_KEY secret is not set"
            echo "Please set the API key from https://www.data.go.kr/data/15019347/openapi.do"
            exit 1
          fi
          echo "API key is configured"

      # ----------------------------------------------------------------------
      # Collect Neologisms
      # ----------------------------------------------------------------------
      - name: Collect neologisms from OpenDict API
        id: collect
        env:
          OPENDICT_API_KEY: ${{ secrets.OPENDICT_API_KEY }}
        run: |
          MODE="${{ steps.setup.outputs.mode }}"
          KEYWORDS="${{ github.event.inputs.keywords }}"
          MAX_ENTRIES="${{ github.event.inputs.max_entries || '100' }}"

          echo "## Collection Parameters" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: $MODE" >> $GITHUB_STEP_SUMMARY
          echo "- Max entries: $MAX_ENTRIES" >> $GITHUB_STEP_SUMMARY
          echo "- Custom keywords: ${KEYWORDS:-none}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Define search keywords based on mode
          case "$MODE" in
            weekly)
              SEARCH_KEYWORDS="신조어,AI,메타버스,MZ세대"
              ;;
            monthly)
              SEARCH_KEYWORDS="신조어,신어,AI,블록체인,가상화폐,메타버스,MZ세대,워라밸,인플루언서,밈,K-팝,K-드라마,챗GPT,생성AI"
              ;;
            custom)
              SEARCH_KEYWORDS="$KEYWORDS"
              ;;
          esac

          echo "Search keywords: $SEARCH_KEYWORDS"

          # Create collection script
          cat > collect.sh << 'COLLECT_EOF'
          #!/bin/bash
          set -e

          KEYWORDS="$1"
          MAX="$2"
          API_KEY="$3"
          OUTPUT="collected.csv"

          # Initialize output file
          > "$OUTPUT"

          # Process each keyword
          IFS=',' read -ra KEYWORD_ARRAY <<< "$KEYWORDS"
          TOTAL=0

          for keyword in "${KEYWORD_ARRAY[@]}"; do
            echo "Searching for: $keyword"

            # Use CLI sync command
            ./rust/target/release/mecab-ko sync \
              --source opendict \
              --query "$keyword" \
              --api-key "$API_KEY" \
              --max-results 20 \
              --output "temp_${keyword//[^a-zA-Z0-9가-힣]/_}.csv" \
              2>&1 || true

            # Append to main output (skip header if exists)
            if [ -f "temp_${keyword//[^a-zA-Z0-9가-힣]/_}.csv" ]; then
              cat "temp_${keyword//[^a-zA-Z0-9가-힣]/_}.csv" >> "$OUTPUT"
              rm "temp_${keyword//[^a-zA-Z0-9가-힣]/_}.csv"
            fi

            # Rate limiting - wait 1 second between API calls
            sleep 1

            # Check if we've reached max entries
            CURRENT_COUNT=$(wc -l < "$OUTPUT" | tr -d ' ')
            if [ "$CURRENT_COUNT" -ge "$MAX" ]; then
              echo "Reached max entries limit ($MAX)"
              head -n "$MAX" "$OUTPUT" > temp_output.csv
              mv temp_output.csv "$OUTPUT"
              break
            fi
          done

          # Report results
          FINAL_COUNT=$(wc -l < "$OUTPUT" | tr -d ' ')
          echo "Total collected: $FINAL_COUNT entries"
          COLLECT_EOF

          chmod +x collect.sh
          ./collect.sh "$SEARCH_KEYWORDS" "$MAX_ENTRIES" "$OPENDICT_API_KEY"

          # Count new entries (excluding empty lines and comments)
          if [ -f collected.csv ]; then
            NEW_COUNT=$(grep -v '^#' collected.csv | grep -v '^$' | wc -l | tr -d ' ')
          else
            NEW_COUNT=0
          fi

          echo "new_entries=$NEW_COUNT" >> $GITHUB_OUTPUT
          echo "## Collection Results" >> $GITHUB_STEP_SUMMARY
          echo "- Entries collected: $NEW_COUNT" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Filter Duplicates
      # ----------------------------------------------------------------------
      - name: Filter duplicates against existing dictionary
        if: steps.collect.outputs.new_entries != '0'
        id: filter
        run: |
          echo "Filtering duplicates..."

          # Extract existing surface forms
          if [ -f "$NEOLOGISMS_CSV" ]; then
            # Skip comments and header, extract first column (surface form)
            grep -v '^#' "$NEOLOGISMS_CSV" | cut -d',' -f1 | sort -u > existing_surfaces.txt
          else
            touch existing_surfaces.txt
          fi

          # Filter collected entries
          BEFORE_COUNT=$(wc -l < collected.csv | tr -d ' ')

          # Create filtered output
          > filtered.csv
          while IFS= read -r line; do
            # Skip empty lines
            [ -z "$line" ] && continue

            # Extract surface form (first field)
            SURFACE=$(echo "$line" | cut -d',' -f1)

            # Check if not in existing
            if ! grep -qxF "$SURFACE" existing_surfaces.txt; then
              echo "$line" >> filtered.csv
            fi
          done < collected.csv

          AFTER_COUNT=$(wc -l < filtered.csv | tr -d ' ')
          DUPLICATES=$((BEFORE_COUNT - AFTER_COUNT))

          echo "Before filtering: $BEFORE_COUNT"
          echo "After filtering: $AFTER_COUNT"
          echo "Duplicates removed: $DUPLICATES"

          # Update new_entries count
          echo "new_entries=$AFTER_COUNT" >> $GITHUB_OUTPUT

          # Move filtered to collected
          mv filtered.csv collected.csv

          echo "## Duplicate Filtering" >> $GITHUB_STEP_SUMMARY
          echo "- Before: $BEFORE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- After: $AFTER_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Duplicates removed: $DUPLICATES" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Merge with Existing Dictionary
      # ----------------------------------------------------------------------
      - name: Merge with existing dictionary
        if: steps.collect.outputs.new_entries != '0' && steps.collect.outputs.new_entries != ''
        run: |
          echo "Merging new entries with existing dictionary..."

          # Backup original
          cp "$NEOLOGISMS_CSV" neologisms_backup.csv

          # Count lines for reference
          ORIGINAL_COUNT=$(grep -v '^#' "$NEOLOGISMS_CSV" | grep -v '^$' | wc -l | tr -d ' ')

          # Find the line number where data starts (after comments)
          HEADER_LINES=$(grep -n '^#' "$NEOLOGISMS_CSV" | tail -1 | cut -d: -f1)
          HEADER_LINES=${HEADER_LINES:-0}

          # Append new entries
          cat collected.csv >> "$NEOLOGISMS_CSV"

          # Final count
          NEW_COUNT=$(grep -v '^#' "$NEOLOGISMS_CSV" | grep -v '^$' | wc -l | tr -d ' ')
          ADDED=$((NEW_COUNT - ORIGINAL_COUNT))

          echo "Original entries: $ORIGINAL_COUNT"
          echo "New total: $NEW_COUNT"
          echo "Entries added: $ADDED"

          echo "## Dictionary Update" >> $GITHUB_STEP_SUMMARY
          echo "- Original entries: $ORIGINAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- New total: $NEW_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Entries added: $ADDED" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Validate Changes
      # ----------------------------------------------------------------------
      - name: Validate CSV format
        if: steps.collect.outputs.new_entries != '0'
        run: |
          echo "Validating CSV format..."

          # Check for malformed lines (should have at least 5 comma-separated fields)
          ERRORS=0
          while IFS= read -r line; do
            # Skip comments and empty lines
            [[ "$line" =~ ^# ]] && continue
            [ -z "$line" ] && continue

            FIELD_COUNT=$(echo "$line" | tr ',' '\n' | wc -l)
            if [ "$FIELD_COUNT" -lt 5 ]; then
              echo "::warning::Malformed line: $line"
              ERRORS=$((ERRORS + 1))
            fi
          done < "$NEOLOGISMS_CSV"

          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::Found $ERRORS malformed lines"
          else
            echo "CSV validation passed"
          fi

      # ----------------------------------------------------------------------
      # Check for Changes
      # ----------------------------------------------------------------------
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet "$NEOLOGISMS_CSV" 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected, will create PR"

            # Show diff summary
            echo "## Changes" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff "$NEOLOGISMS_CSV" | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # ----------------------------------------------------------------------
      # Upload Artifacts
      # ----------------------------------------------------------------------
      - name: Upload collection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neologism-collection-${{ github.run_number }}
          path: |
            collected.csv
            neologisms_backup.csv
          retention-days: 30
          if-no-files-found: ignore

      # ----------------------------------------------------------------------
      # Create Pull Request
      # ----------------------------------------------------------------------
      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            feat(dict): add neologisms from ${{ steps.setup.outputs.mode }} sync

            - Added ${{ steps.collect.outputs.new_entries }} new entries
            - Source: 국립국어원 우리말샘 API
            - Run: ${{ github.run_number }}
          branch: neologism-sync/${{ github.run_number }}
          delete-branch: true
          title: "[자동] 신조어 사전 업데이트 (${{ steps.collect.outputs.new_entries }}개)"
          body: |
            ## 신조어 자동 수집 결과

            ### 수집 정보
            | 항목 | 값 |
            |------|-----|
            | 모드 | ${{ steps.setup.outputs.mode }} |
            | 신규 엔트리 | ${{ steps.collect.outputs.new_entries }}개 |
            | 소스 | 국립국어원 우리말샘 API |
            | 실행 번호 | #${{ github.run_number }} |
            | 실행 시각 | ${{ github.event.repository.updated_at }} |

            ### 변경 내용
            신조어 사전(`data/user-dict/neologisms.csv`)에 새로운 엔트리가 추가되었습니다.

            ### 검토 체크리스트
            - [ ] 추가된 단어가 적절한지 확인
            - [ ] 품사 태그(NNG, NNP, VV 등)가 올바른지 확인
            - [ ] 비용 값이 합리적인지 확인 (낮을수록 우선순위 높음)
            - [ ] 중복 엔트리가 없는지 확인
            - [ ] 부적절한 단어가 포함되지 않았는지 확인

            ### 상세 리포트
            - [Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)

            ### 관련 문서
            - [신조어 사전 가이드](data/user-dict/README.md)
            - [Contributing Guide](CONTRIBUTING.md)

            ---
            > _이 PR은 GitHub Actions에 의해 자동 생성되었습니다._
            > _문제가 있으면 Close하고 수동으로 처리하세요._
          labels: |
            automated
            dictionary
            neologism
          reviewers: |
            hephaex
          draft: false

  # ============================================================================
  # Failure Notification Job
  # ============================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: collect-neologisms
    if: failure()

    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "신조어 수집 워크플로우 실패 :warning:",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "신조어 수집 실패"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:*\n#${{ github.run_number }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Create failure issue (if not exists)
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[자동] 신조어 수집 실패 - Run #${{ github.run_number }}';

            // Check for existing open issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'automated,neologism-sync-failure',
              state: 'open',
              per_page: 5
            });

            // Only create if no recent failure issue exists
            const recentIssue = issues.data.find(issue => {
              const created = new Date(issue.created_at);
              const now = new Date();
              const hoursDiff = (now - created) / (1000 * 60 * 60);
              return hoursDiff < 24;
            });

            if (!recentIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `## 신조어 수집 워크플로우 실패

            **실행 정보**
            - Run Number: #${{ github.run_number }}
            - Run ID: ${{ github.run_id }}
            - 실행 시각: ${new Date().toISOString()}

            **워크플로우 링크**
            - [Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### 확인 사항
            - [ ] \`OPENDICT_API_KEY\` secret이 설정되어 있는지 확인
            - [ ] API 키가 유효한지 확인 (만료 여부)
            - [ ] 우리말샘 API 서버 상태 확인
            - [ ] Rate limit에 걸렸는지 확인
            - [ ] 네트워크 연결 문제인지 확인

            ### 해결 방법
            1. Secrets 확인: Settings > Secrets and variables > Actions
            2. API 키 재발급: https://www.data.go.kr/data/15019347/openapi.do
            3. 수동 실행 테스트: Actions > Neologism Sync > Run workflow

            ---
            _이 이슈는 자동 생성되었습니다. 해결 후 Close해 주세요._`,
                labels: ['automated', 'neologism-sync-failure', 'bug']
              });

              console.log('Created failure issue');
            } else {
              console.log('Recent failure issue already exists, skipping creation');

              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: recentIssue.number,
                body: `추가 실패 발생: Run #${{ github.run_number }}\n[Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
              });
            }

  # ============================================================================
  # Success Summary Job
  # ============================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: collect-neologisms
    if: success()

    steps:
      - name: Generate summary
        run: |
          echo "## Neologism Sync Complete :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ needs.collect-neologisms.outputs.collection_mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New Entries | ${{ needs.collect-neologisms.outputs.new_entries }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Changes | ${{ needs.collect-neologisms.outputs.has_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.collect-neologisms.outputs.has_changes }}" == "true" ]; then
            echo "> A pull request has been created for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "> No new entries to add." >> $GITHUB_STEP_SUMMARY
          fi
