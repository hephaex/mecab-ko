name: Code Quality Analysis

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'rust/**'
      - '.github/workflows/code-quality.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'rust/**'
      - '.github/workflows/code-quality.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Check for unused dependencies
  unused-dependencies:
    name: Unused Dependencies Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Run cargo-udeps
        run: |
          cargo udeps \
            --manifest-path rust/Cargo.toml \
            --all-targets \
            --workspace \
            --exclude mecab-ko-python \
            --exclude mecab-ko-node \
            --exclude mecab-ko-wasm \
            --exclude mecab-ko-elasticsearch
        continue-on-error: true

  # Check for unmaintained/outdated dependencies
  dependency-outdated:
    name: Dependency Freshness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Check outdated dependencies
        run: |
          cargo outdated \
            --manifest-path rust/Cargo.toml \
            --format list \
            --exit-code 0 || true

  # Code metrics and statistics
  code-metrics:
    name: Code Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable

      - name: Install tokei for line counting
        run: cargo install tokei

      - name: Generate code statistics
        run: |
          echo "## Code Statistics" > code-stats.md
          echo "" >> code-stats.md
          echo "### Lines of Code" >> code-stats.md
          echo '```' >> code-stats.md
          tokei rust/ --sort lines >> code-stats.md
          echo '```' >> code-stats.md
          cat code-stats.md

      - name: Upload code statistics
        uses: actions/upload-artifact@v4
        with:
          name: code-statistics
          path: code-stats.md
          retention-days: 30

  # Documentation coverage check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable

      - name: Build documentation (fail on warnings)
        run: |
          cargo doc \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --exclude mecab-ko-python \
            --exclude mecab-ko-node \
            --exclude mecab-ko-wasm \
            --exclude mecab-ko-elasticsearch \
            --no-deps \
            --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  summary:
    name: Quality Check Summary
    runs-on: ubuntu-latest
    needs: [unused-dependencies, dependency-outdated, code-metrics, docs-check]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unused Dependencies | ${{ needs.unused-dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Freshness | ${{ needs.dependency-outdated.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Metrics | ${{ needs.code-metrics.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs-check.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.unused-dependencies.result }}" != "success" ||
                "${{ needs.docs-check.result }}" != "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status**: Some critical checks failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
