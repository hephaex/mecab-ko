name: FFI Crates Tests

# Tests for FFI/binding crates that require special environments
# - mecab-ko-python: requires Python
# - mecab-ko-node: requires Node.js
# - mecab-ko-wasm: requires wasm-pack/clang
# - mecab-ko-elasticsearch: requires JDK

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'rust/crates/mecab-ko-python/**'
      - 'rust/crates/mecab-ko-node/**'
      - 'rust/crates/mecab-ko-wasm/**'
      - 'rust/crates/mecab-ko-elasticsearch/**'
      - '.github/workflows/ffi-tests.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'rust/crates/mecab-ko-python/**'
      - 'rust/crates/mecab-ko-node/**'
      - 'rust/crates/mecab-ko-wasm/**'
      - 'rust/crates/mecab-ko-elasticsearch/**'
      - '.github/workflows/ffi-tests.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install maturin
        run: pip install maturin pytest

      - name: Build Python bindings
        working-directory: rust/crates/mecab-ko-python
        run: maturin develop

      - name: Run Python tests
        working-directory: rust/crates/mecab-ko-python
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          fi

      - name: Run clippy on Python bindings
        run: |
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-python \
            --all-targets \
            -- -D warnings

  node-bindings:
    name: Node.js Bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '21.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: node-${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: rust/crates/mecab-ko-node
        run: npm install

      - name: Build Node.js bindings
        working-directory: rust/crates/mecab-ko-node
        run: npm run build

      - name: Run Node.js tests
        working-directory: rust/crates/mecab-ko-node
        run: npm test || echo "Tests not implemented yet"

      - name: Run clippy on Node.js bindings
        run: |
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-node \
            -- -D warnings

  wasm-bindings:
    name: WebAssembly Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.org/wasm-pack/installer/init.sh -sSf | sh

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build WASM bindings
        working-directory: rust/crates/mecab-ko-wasm
        run: wasm-pack build --target bundler --release

      - name: Run WASM tests
        working-directory: rust/crates/mecab-ko-wasm
        run: wasm-pack test --headless --firefox || echo "Tests not implemented yet"

      - name: Run clippy on WASM bindings
        run: |
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-wasm \
            --target wasm32-unknown-unknown \
            -- -D warnings

  elasticsearch-plugin:
    name: Elasticsearch Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Elasticsearch plugin
        # Note: Full JNI setup requires JDK, which is expensive in CI
        # For now, we build the Rust library only
        run: |
          cargo build \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-elasticsearch \
            --release

      - name: Run clippy on Elasticsearch plugin
        run: |
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-elasticsearch \
            --all-targets \
            -- -D warnings

      - name: Generate Elasticsearch plugin docs
        run: |
          cargo doc \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-elasticsearch \
            --no-deps \
            --release
        env:
          RUSTDOCFLAGS: -D warnings

  # Summary of FFI tests
  ffi-status:
    name: FFI Tests Status
    runs-on: ubuntu-latest
    needs: [python-bindings, node-bindings, wasm-bindings, elasticsearch-plugin]
    if: always()
    steps:
      - name: Check FFI Tests Status
        run: |
          echo "## FFI Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Python Bindings: ${{ needs.python-bindings.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Bindings: ${{ needs.node-bindings.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- WebAssembly Bindings: ${{ needs.wasm-bindings.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Elasticsearch Plugin: ${{ needs.elasticsearch-plugin.result }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.python-bindings.result }}" != "success" ||
                "${{ needs.node-bindings.result }}" != "success" ||
                "${{ needs.wasm-bindings.result }}" != "success" ||
                "${{ needs.elasticsearch-plugin.result }}" != "success" ]]; then
            echo "### Status: FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
