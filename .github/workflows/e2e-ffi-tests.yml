name: E2E and FFI Tests

# Comprehensive test suite combining:
# - E2E tests: CLI, Python, Node.js, WASM cross-platform behavior
# - FFI/binding crates: Python bindings, Node.js bindings, WASM bindings, Elasticsearch plugin
#
# FFI crates excluded from main workspace and need special environments:
#   - mecab-ko-python: maturin + Python
#   - mecab-ko-node: napi-rs + Node.js
#   - mecab-ko-wasm: wasm-pack + wasm32 target
#   - mecab-ko-elasticsearch: Rust library only

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'rust/**'
      - 'tests/e2e/**'
      - 'rust/crates/mecab-ko-python/**'
      - 'rust/crates/mecab-ko-node/**'
      - 'rust/crates/mecab-ko-wasm/**'
      - 'rust/crates/mecab-ko-elasticsearch/**'
      - '.github/workflows/e2e-ffi-tests.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'rust/**'
      - 'tests/e2e/**'
      - 'rust/crates/mecab-ko-python/**'
      - 'rust/crates/mecab-ko-node/**'
      - 'rust/crates/mecab-ko-wasm/**'
      - 'rust/crates/mecab-ko-elasticsearch/**'
      - '.github/workflows/e2e-ffi-tests.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ============================================================================
  # E2E Tests: Cross-platform CLI, Python, Node.js, WASM behavior
  # ============================================================================

  cli-tests:
    name: CLI E2E Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          components: rustfmt clippy

      - name: Install bats (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Install bats (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install bats
        continue-on-error: true

      - name: Build CLI
        working-directory: rust
        run: cargo build --bin mecab --release

      - name: Run CLI E2E tests
        working-directory: tests/e2e/cli
        run: |
          export MECAB_BIN="${GITHUB_WORKSPACE}/rust/target/release/mecab"
          bats test_cli_basic.bats test_cli_output_formats.bats || echo "Some tests skipped"
        if: runner.os != 'Windows'

  python-e2e:
    name: Python E2E Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "${{ github.workspace }}/.venv/Scripts" >> $GITHUB_PATH
          else
            echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          fi

      - name: Install maturin
        run: pip install maturin

      - name: Install Python test dependencies
        working-directory: tests/e2e/python
        run: pip install -r requirements.txt

      - name: Build Python binding
        run: maturin develop --release --manifest-path rust/crates/mecab-ko-python/Cargo.toml

      - name: Run Python E2E tests
        working-directory: tests/e2e/python
        run: pytest -v --tb=short --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: python-e2e-test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: tests/e2e/python/junit.xml

  nodejs-e2e:
    name: Node.js E2E Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build Node.js binding
        working-directory: rust/crates/mecab-ko-node
        run: |
          npm install
          npm run build || echo "Build not configured yet"
        continue-on-error: true

      - name: Install test dependencies
        working-directory: tests/e2e/node
        run: npm install

      - name: Run Node.js E2E tests
        working-directory: tests/e2e/node
        run: npm test
        continue-on-error: true

  wasm-e2e:
    name: WASM E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM binding
        run: wasm-pack build rust/crates/mecab-ko-wasm --target web

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/e2e/wasm
        run: npm install

      - name: Run WASM E2E tests
        working-directory: tests/e2e/wasm
        run: npm test
        continue-on-error: true

  e2e-coverage:
    name: E2E Coverage Report
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install maturin pytest pytest-cov
          cargo install cargo-tarpaulin

      - name: Run coverage
        working-directory: rust
        run: cargo tarpaulin --out Xml --output-dir ../coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml
          flags: e2e-tests
          name: e2e-coverage
        continue-on-error: true

  # ============================================================================
  # FFI Binding Tests: Python, Node.js, WASM, Elasticsearch
  # ============================================================================

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "${{ github.workspace }}/.venv/Scripts" >> $GITHUB_PATH
          else
            echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          fi

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest

      - name: Build Python bindings
        run: maturin develop --manifest-path rust/crates/mecab-ko-python/Cargo.toml

      - name: Run Python tests
        working-directory: rust/crates/mecab-ko-python
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          fi

  node-bindings:
    name: Node.js Bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup
        with:
          cache-key: node-${{ matrix.node-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: rust/crates/mecab-ko-node
        run: npm install

      - name: Build Node.js bindings
        working-directory: rust/crates/mecab-ko-node
        run: npm run build

      - name: Run Node.js tests
        working-directory: rust/crates/mecab-ko-node
        run: npm test || echo "Tests not implemented yet"

  wasm-bindings:
    name: WebAssembly Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM bindings
        run: wasm-pack build rust/crates/mecab-ko-wasm --target bundler --release

  elasticsearch-plugin:
    name: Elasticsearch Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Rust Setup
        uses: ./.github/actions/rust-setup

      - name: Build Elasticsearch plugin
        run: |
          cargo build \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-elasticsearch \
            --release

      - name: Run clippy on Elasticsearch plugin
        run: |
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            -p mecab-ko-elasticsearch \
            --lib \
            -- -D warnings

  # ============================================================================
  # Combined Status Check: E2E + FFI test results
  # ============================================================================

  test-status:
    name: E2E and FFI Test Status
    runs-on: ubuntu-latest
    needs:
      - cli-tests
      - python-e2e
      - nodejs-e2e
      - wasm-e2e
      - e2e-coverage
      - python-bindings
      - node-bindings
      - wasm-bindings
      - elasticsearch-plugin
    if: always()
    steps:
      - name: Check E2E and FFI Tests Status
        run: |
          echo "## E2E and FFI Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "- CLI Tests: ${{ needs.cli-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python E2E: ${{ needs.python-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js E2E: ${{ needs.nodejs-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- WASM E2E: ${{ needs.wasm-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Coverage: ${{ needs.e2e-coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### FFI Binding Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Python Bindings: ${{ needs.python-bindings.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Bindings: ${{ needs.node-bindings.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- WebAssembly Bindings: ${{ needs.wasm-bindings.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Elasticsearch Plugin: ${{ needs.elasticsearch-plugin.result }}" >> $GITHUB_STEP_SUMMARY

          # wasm-e2e and e2e-coverage use job-level continue-on-error (experimental/optional).
          # Only FFI binding results are hard-gated here.
          if [[ "${{ needs.python-bindings.result }}" != "success" ||
                "${{ needs.node-bindings.result }}" != "success" ||
                "${{ needs.wasm-bindings.result }}" != "success" ||
                "${{ needs.elasticsearch-plugin.result }}" != "success" ]]; then
            echo "### Status: FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
