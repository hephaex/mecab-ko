[package]
name = "mecab-ko-wasm"
version = "0.7.2"
edition = "2021"
rust-version = "1.80"
authors = ["hephaex <hephaex@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hephaex/mecab-ko"
homepage = "https://github.com/hephaex/mecab-ko"
documentation = "https://docs.rs/mecab-ko-wasm"
readme = "README.md"
description = "WebAssembly bindings for MeCab-Ko (Korean morphological analyzer)"
keywords = ["korean", "morphology", "wasm", "nlp", "mecab"]
categories = ["text-processing", "science", "wasm"]
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
doc = false  # Skip docs for WASM bindings (FFI crate, not meant for Rust docs)

[dependencies]
mecab-ko-core = { version = "0.7.2", path = "../mecab-ko-core", default-features = false }
wasm-bindgen = "0.2.114"
js-sys = "0.3.91"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["console_error_panic_hook"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
