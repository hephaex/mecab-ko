[package]
name = "mecab-ko-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mecab-ko-python"
readme = "README.md"
description = "Python bindings for MeCab-Ko (Korean morphological analyzer)"
keywords = ["korean", "morphology", "python", "nlp", "mecab"]
categories = ["text-processing", "science"]
publish = false

[lib]
name = "mecab_ko"
crate-type = ["cdylib"]
test = false  # Skip lib tests for cdylib (PyO3 requires Python runtime)
doc = false   # Skip docs to avoid filename collision with root mecab-ko crate

[dependencies]
mecab-ko-core = { version = "0.1.0", path = "../mecab-ko-core" }
pyo3 = { workspace = true }
parking_lot = "0.12"

# Python 바인딩에서는 일부 lint 완화
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
