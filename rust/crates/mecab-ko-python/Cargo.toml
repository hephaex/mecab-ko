[package]
name = "mecab-ko-python"
version = "0.7.2"
edition = "2021"
rust-version = "1.80"
authors = ["hephaex <hephaex@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hephaex/mecab-ko"
homepage = "https://github.com/hephaex/mecab-ko"
documentation = "https://docs.rs/mecab-ko-python"
readme = "README.md"
description = "Python bindings for MeCab-Ko (Korean morphological analyzer)"
keywords = ["korean", "morphology", "python", "nlp", "mecab"]
categories = ["text-processing", "science"]
publish = false

[lib]
name = "mecab_ko"
crate-type = ["cdylib"]
test = false  # Skip lib tests for cdylib (PyO3 requires Python runtime)
doc = false   # Skip docs to avoid filename collision with root mecab-ko crate

[dependencies]
mecab-ko-core = { version = "0.7.2", path = "../mecab-ko-core" }
pyo3 = { version = "0.24.1", features = ["extension-module", "generate-import-lib"] }
parking_lot = "0.12"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
