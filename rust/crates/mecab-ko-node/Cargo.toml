[package]
name = "mecab-ko-node"
version = "0.7.2"
edition = "2021"
rust-version = "1.80"
authors = ["hephaex <hephaex@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hephaex/mecab-ko"
homepage = "https://github.com/hephaex/mecab-ko"
documentation = "https://docs.rs/mecab-ko-node"
readme = "README.md"
description = "Node.js bindings for MeCab-Ko Korean morphological analyzer"
keywords = ["korean", "morphology", "nlp", "nodejs", "napi"]
categories = ["text-processing", "science", "api-bindings"]
publish = false

[lib]
crate-type = ["cdylib"]
doc = false  # Skip docs for Node.js bindings (FFI crate, not meant for Rust docs)

[dependencies]
mecab-ko-core = { version = "0.7.2", path = "../mecab-ko-core" }
napi = "3"
napi-derive = "3"
parking_lot = "0.12"

[build-dependencies]
napi-build = "2.3"

[lints.rust]
# napi-derive 매크로가 FFI extern fn을 unsafe로 생성하므로 allow 필요.
# workspace의 deny(unsafe_code)는 workspace에서 exclude된 이 크레이트에는 적용되지 않음.
# 참고: https://napi.rs/docs/introduction/getting-started
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
