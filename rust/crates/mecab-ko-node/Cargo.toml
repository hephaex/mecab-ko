[package]
name = "mecab-ko-node"
version.workspace = true
edition.workspace = true
rust-version = "1.77"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mecab-ko-node"
readme = "README.md"
description = "Node.js bindings for MeCab-Ko Korean morphological analyzer"
keywords = ["korean", "morphological-analysis", "nlp", "nodejs", "napi"]
categories = ["text-processing", "science", "api-bindings"]

[lib]
crate-type = ["cdylib"]

[dependencies]
mecab-ko-core = { path = "../mecab-ko-core" }
# napi-rs for Node.js bindings
napi = "2.16"
napi-derive = "2.16"
# Thread-safe locking
parking_lot = "0.12"

[build-dependencies]
napi-build = "2.1"

# Override workspace lints for FFI code
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow some patterns common in FFI code
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
