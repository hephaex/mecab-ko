[package]
name = "mecab-ko-elasticsearch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mecab-ko-elasticsearch"
readme = "README.md"
description = "Elasticsearch/Lucene Nori 호환 레이어 - JNI 바인딩 및 분석기 플러그인"
keywords = ["korean", "elasticsearch", "lucene", "nori", "analyzer"]
categories = ["text-processing", "api-bindings"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mecab-ko-core = { path = "../mecab-ko-core" }
mecab-ko-hangul = { path = "../mecab-ko-hangul" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# Performance optimizations
# Updated to 0.16.3+ to fix IterMut soundness issue (RUSTSEC-2026-0002)
lru = "0.16.3"
parking_lot = "0.12"
rayon = "1.10"

# JNI bindings
jni = { version = "0.21", optional = true }
once_cell = { version = "1.19", optional = true }

# Async support (optional)
tokio = { version = "1.35", features = ["sync", "rt"], optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile = "3.10"

[features]
default = ["batch", "cache"]
jni-bindings = ["jni", "once_cell"]
async = ["tokio"]
batch = []
cache = []

[[bench]]
name = "analyzer_bench"
harness = false

[[bench]]
name = "performance_bench"
harness = false

[lints]
workspace = true
