[package]
name = "mecab-ko-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mecab-ko-core"
readme = "README.md"
description = "한국어 형태소 분석 핵심 엔진 - Lattice, Viterbi, 토크나이저"
keywords = ["korean", "morphology", "viterbi", "nlp", "tokenizer"]
categories = ["text-processing", "science"]

[dependencies]
mecab-ko-hangul = { version = "0.1.1", path = "../mecab-ko-hangul" }
mecab-ko-dict = { version = "0.1.1", path = "../mecab-ko-dict", default-features = false }
thiserror.workspace = true
serde.workspace = true
# Memory pooling and optimization
string-interner = "0.17"
parking_lot = "0.12"
# Async runtime (optional)
tokio = { version = "1.0", features = ["full"], optional = true }
# Parallel processing
rayon = "1.10"

[dev-dependencies]
criterion.workspace = true
tokio = { version = "1.0", features = ["full", "test-util"] }

[features]
default = ["zstd"]
async = ["tokio"]
simd = ["mecab-ko-dict/simd"]
simd-dict = ["simd"]
# Enable zstd compression support (disabled for WASM)
zstd = ["mecab-ko-dict/zstd"]
# Exposes test_utils module for external test crates that need full-dict helpers.
test-utils = []

[[bench]]
name = "tokenizer_bench"
harness = false

[[bench]]
name = "lattice_bench"
harness = false

[[bench]]
name = "viterbi_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false

# Temporarily disabled - needs fixes
# [[bench]]
# name = "memory_pool_bench"
# harness = false

# [[bench]]
# name = "simd_bench"
# harness = false

[[example]]
name = "async_example"
required-features = ["async"]

[[example]]
name = "simd_demo"
required-features = ["simd"]

[lints]
workspace = true
