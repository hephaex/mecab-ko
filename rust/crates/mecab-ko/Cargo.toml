[package]
name = "mecab-ko"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mecab-ko"
readme = "README.md"
description = "한국어 형태소 분석기 - MeCab-Ko의 순수 Rust 구현"
keywords = ["korean", "morphology", "nlp", "tokenizer", "mecab"]
categories = ["text-processing", "science"]

[dependencies]
mecab-ko-core = { version = "0.2.0", path = "../mecab-ko-core" }
mecab-ko-dict = { version = "0.2.0", path = "../mecab-ko-dict" }
mecab-ko-hangul = { version = "0.2.0", path = "../mecab-ko-hangul" }

[dev-dependencies]
criterion.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# TODO: 벤치마크 구현 후 활성화
# [[bench]]
# name = "mecab_bench"
# harness = false

[lints]
workspace = true

[features]
default = []
# 사전 빌더 기능 (사전 생성 시에만 필요)
builder = ["dep:mecab-ko-dict-builder"]

[dependencies.mecab-ko-dict-builder]
version = "0.2.0"
path = "../mecab-ko-dict-builder"
optional = true
