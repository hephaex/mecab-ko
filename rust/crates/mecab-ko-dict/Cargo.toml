[package]
name = "mecab-ko-dict"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mecab-ko-dict"
readme = "README.md"
description = "한국어 형태소 사전 관리 - 바이너리 포맷, FST 검색, 연접 비용"
keywords = ["korean", "dictionary", "morpheme", "nlp", "fst"]
categories = ["text-processing", "data-structures"]

[dependencies]
mecab-ko-hangul = { version = "0.6.0", path = "../mecab-ko-hangul" }
thiserror.workspace = true
serde.workspace = true
fst.workspace = true
yada.workspace = true
byteorder.workspace = true
memmap2.workspace = true
zstd = { workspace = true, optional = true }
compact_str = { workspace = true, optional = true }
notify = "6.1"
crossbeam-channel = "0.5"

[features]
default = ["zstd"]
simd = []
# Enable zstd compression support (disabled for WASM)
zstd = ["dep:zstd"]
# Enable compact string support for reduced memory usage
compact-strings = ["dep:compact_str"]

[dev-dependencies]
criterion.workspace = true
tempfile = { workspace = true }

[lints]
workspace = true
