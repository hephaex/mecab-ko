[package]
name = "mecab-ko-profiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mecab-ko-profiler"
readme = "README.md"
description = "Memory profiling tools for MeCab-Ko components"
keywords = ["profiling", "memory", "benchmark", "mecab", "korean"]
categories = ["development-tools::profiling", "memory-management"]
publish = false

[dependencies]
# Core dependencies
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Memory profiling
dhat = "0.3"
tracking-allocator = "0.4"

# jemalloc support (optional, for production profiling)
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"], optional = true }

# Statistics and reporting
chrono = "0.4"
humansize = "2.1"
tabled = "0.20"

# Flamegraph generation (optional)
inferno = { version = "0.11", optional = true }

# CLI dependencies
clap = { workspace = true, optional = true }
colored = { version = "2.1", optional = true }

# Internal dependencies
mecab-ko-core = { version = "0.7.2", path = "../mecab-ko-core", optional = true }
mecab-ko-dict = { version = "0.7.2", path = "../mecab-ko-dict", optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile = { workspace = true }

[features]
default = ["cli", "profilers"]
cli = ["dep:clap", "dep:colored"]
profilers = ["dep:mecab-ko-core", "dep:mecab-ko-dict"]
flamegraph = ["dep:inferno"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
test-allocator = [] # Enable global allocator for integration tests
full = ["cli", "profilers", "flamegraph", "jemalloc"]

[[bin]]
name = "mecab-profile"
required-features = ["cli"]

[lib]
name = "mecab_ko_profiler"
path = "src/lib.rs"

[[bench]]
name = "memory_bench"
harness = false
