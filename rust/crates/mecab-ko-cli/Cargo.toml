[package]
name = "mecab-ko-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mecab-ko-cli"
readme = "README.md"
description = "한국어 형태소 분석기 CLI 도구"
keywords = ["korean", "morphology", "cli", "nlp"]
categories = ["command-line-utilities", "text-processing"]
publish = false

[[bin]]
name = "mecab"
path = "src/main.rs"

[dependencies]
mecab-ko-core = { version = "0.6.0", path = "../mecab-ko-core" }
mecab-ko-dict = { version = "0.6.0", path = "../mecab-ko-dict" }
mecab-ko-dict-sync = { version = "0.6.0", path = "../mecab-ko-dict-sync" }
clap = { workspace = true, features = ["env"] }
clap_complete = "4.4"
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
indicatif.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
