[workspace]
resolver = "2"
members = [
    "crates/mecab-ko",
    "crates/mecab-ko-core",
    "crates/mecab-ko-dict",
    "crates/mecab-ko-dict-builder",
    "crates/mecab-ko-dict-validator",
    "crates/mecab-ko-hangul",
    "crates/mecab-ko-cli",
    "crates/mecab-ko-python",
    "crates/mecab-ko-wasm",
    "crates/mecab-ko-node",
    "crates/mecab-ko-elasticsearch",
    "crates/mecab-ko-profiler",
    "crates/benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["hephaex <hephaex@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hephaex/mecab-ko"
homepage = "https://github.com/hephaex/mecab-ko"
documentation = "https://docs.rs/mecab-ko"
readme = "README.md"
keywords = ["korean", "morphological-analysis", "nlp", "tokenizer", "mecab"]
categories = ["text-processing", "science"]

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# NOTE: bincode 1.3 is unmaintained (RUSTSEC-2025-0141) but bincode 3.0 is broken
# Consider migrating to postcard, ciborium, or rmp-serde in Phase 2
# For now, keeping 1.3 as it's functional despite being unmaintained
bincode = "1.3"

# Compression
lzma-rs = "0.3"
zstd = "0.13"

# Data structures
fst = "0.4"
yada = "0.5"                    # Double Array Trie (Lindera 스타일)
byteorder = "1.5"
memmap2 = "0.9"

# Serialization
# Updated to 0.8.13+ to fix UB in Arc/Rc impls on OOM (RUSTSEC-2026-0001)
rkyv = "0.8.13"  # Zero-copy 직렬화

# Text processing
csv = "1.3"                     # CSV 파싱
unicode-normalization = "0.1"   # 유니코드 정규화
encoding_rs = "0.8"             # EUC-KR 등 인코딩

# CLI
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"              # 프로그레스 바

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Testing & Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Python bindings (optional)
# Updated to 0.24.1+ to fix buffer overflow in PyString::from_object (RUSTSEC-2025-0020)
pyo3 = { version = "0.24.1", features = ["extension-module"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# 엄격한 에러 처리
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = true
codegen-units = 1
