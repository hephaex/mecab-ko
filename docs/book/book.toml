[book]
title = "MeCab-Ko Documentation"
authors = ["Mario Cho <hephaex@gmail.com>"]
language = "ko"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/hephaex/mecab-ko"
edit-url-template = "https://github.com/hephaex/mecab-ko/edit/main/docs/book/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
